services:
  postgres:
    image: postgres:17-alpine
    container_name: attendycert-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-attendycert}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-attendycert}
      POSTGRES_DB: ${DB_NAME:-attendycert}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-attendycert} -d ${DB_NAME:-attendycert}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: attendycert-redis-dev
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data_dev:
  redis_data_dev:
