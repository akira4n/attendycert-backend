services:
  postgres:
    image: postgres:17-alpine
    container_name: attendycert-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-attendycert}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-attendycert}
      POSTGRES_DB: ${DB_NAME:-attendycert}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-attendycert} -d ${DB_NAME:-attendycert}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: attendycert-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendycert-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-attendycert}:${DB_PASSWORD:-attendycert}@postgres:5432/${DB_NAME:-attendycert}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"AttendyCert"}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['sh', '-c', 'npx prisma migrate deploy && node src/app.js']

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendycert-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-attendycert}:${DB_PASSWORD:-attendycert}@postgres:5432/${DB_NAME:-attendycert}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"AttendyCert"}
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    command: ['node', 'src/workers/email.worker.js']

volumes:
  postgres_data:
